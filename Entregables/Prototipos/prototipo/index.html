<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGEDA · Prototipo navegable (P-02)</title>
<style>
/* ===== Wireframe (fidelidad media, en gris) ===== */
:root{
  --bg:#ececec; --panel:#ffffff; --line:#8c8c8c; --line-soft:#c8c8c8;
  --text:#1e1e1e; --muted:#4d4d4d; --primary:#2e2e2e; --primary-text:#ffffff;
  --secondary:#ffffff; --fill:#f5f5f5; --fill2:#e0e0e0;
  --error-bg:#ffffff; --error-line:#1e1e1e; --ok-bg:#ffffff; --warn-bg:#f5f5f5;
  --chip:#e6e6e6; --band:#1e1e1e; --band-text:#ffffff;
  --font:"Segoe UI", Arial, Helvetica, sans-serif; --radius:4px;
}
body.hifi{
  --bg:#eef3f6; --panel:#ffffff; --line:#9fb3c2; --line-soft:#d5e0e8;
  --text:#14212b; --muted:#43545f; --primary:#0b5c8a; --primary-text:#ffffff;
  --secondary:#ffffff; --fill:#f6f9fb; --fill2:#dbe7ef;
  --error-bg:#fdecec; --error-line:#a61b1b; --ok-bg:#e8f5ec; --warn-bg:#fff6e0;
  --chip:#e3edf4; --band:#7a4b00; --band-text:#ffffff; --radius:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--text);background:var(--bg)}
a{color:var(--text)}
.band{background:var(--band);color:var(--band-text);font-size:13px;padding:4px 14px;display:flex;justify-content:space-between;gap:12px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 26px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column}
.brand{padding:0 16px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.brand b{font-size:20px;letter-spacing:.5px}
.brand div{font-size:12.5px;color:var(--muted)}
.nav a{display:block;padding:9px 16px;text-decoration:none;border-left:4px solid transparent;font-size:14.5px}
.nav a:hover{background:var(--fill)}
.nav a.on{border-left-color:var(--primary);background:var(--fill2);font-weight:600}
.nav .sep{height:1px;background:var(--line-soft);margin:8px 16px}
.side .foot{margin-top:auto;padding:10px 16px;font-size:12.5px;color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:16px}
.top .quick{flex:1;display:flex;gap:6px;max-width:520px}
.top .quick input{flex:1}
.top .who{margin-left:auto;text-align:right;font-size:13.5px}
.chipbk{font-size:12.5px;border:1px solid var(--line);border-radius:12px;padding:2px 10px;background:var(--fill);white-space:nowrap}
.content{padding:18px 22px 40px;overflow:auto}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:15px;margin:12px 0 6px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:160px;flex:1}
.field label{font-weight:600;font-size:14px}
.req{font-weight:400;color:var(--muted);font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14.5px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--text);min-height:36px}
input[disabled],select[disabled]{background:var(--fill2);color:var(--muted)}
input.bad,select.bad{border:2px solid var(--error-line)}
.errtxt{font-size:13px;font-weight:600}
.errtxt::before{content:"⚠ "}
button,.btn{font:inherit;font-size:14.5px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--primary);background:var(--secondary);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block;min-height:38px;line-height:20px;white-space:nowrap}
.btn.pri,button.pri{background:var(--primary);color:var(--primary-text);font-weight:600}
.btn.link{border-color:transparent;background:transparent;text-decoration:underline;padding:8px 6px}
.btn.danger{border:2px solid var(--error-line);font-weight:600}
.btn.sm{font-size:13px;padding:4px 10px;min-height:30px}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);font-size:14px}
th,td{border-bottom:1px solid var(--line-soft);padding:8px 9px;text-align:left;vertical-align:top}
th{background:var(--fill2);font-weight:600;border-bottom:1px solid var(--line)}
tr.muted td{color:var(--muted)}
tr.sel td{background:var(--fill)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:12.5px;background:var(--chip);white-space:nowrap;margin:1px 2px 1px 0}
.tag.strong{border:2px solid var(--text);font-weight:600}
.tag.dash{border-style:dashed}
body.hifi .tag.ok{background:#e1f2e6;border-color:#2f7a45}
body.hifi .tag.no{background:#fde7e7;border-color:#a61b1b}
body.hifi .tag.pend{background:#fff1cf;border-color:#8a6100}
.msg{border:1px solid var(--line);border-left:6px solid var(--text);padding:10px 14px;border-radius:var(--radius);margin:0 0 14px;background:var(--fill)}
.msg b{display:block;margin-bottom:2px}
.msg.error{border-left-color:var(--error-line);background:var(--error-bg);border-width:2px 2px 2px 6px}
.msg.ok{background:var(--ok-bg)}
.msg.warn{background:var(--warn-bg);border-left-style:double}
body.hifi .msg.ok{border-left-color:#2f7a45}
body.hifi .msg.warn{border-left-color:#8a6100}
body.hifi .msg.info{border-left-color:#0b5c8a}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 18px;text-decoration:none;border:1px solid transparent;border-bottom:none;margin-bottom:-1px;border-radius:var(--radius) var(--radius) 0 0}
.tabs a.on{border-color:var(--line);background:var(--panel);font-weight:600}
.kpi{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:12px 14px}
.kpi .n{font-size:26px;font-weight:700}
.kpi .l{font-size:13px;color:var(--muted)}
.bar{height:14px;border:1px solid var(--line);border-radius:7px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted)}
body.hifi .bar i{background:#0b5c8a}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;background:var(--fill)}
.viewer{border:1px solid var(--line);background:var(--fill2);min-height:330px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);text-align:center;padding:12px}
.ph{background:repeating-linear-gradient(45deg,var(--fill2),var(--fill2) 8px,var(--fill) 8px,var(--fill) 16px);border:1px solid var(--line);width:72%;height:220px}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px}
.ftable table{table-layout:fixed}.ftable select,.ftable input{width:100%;min-width:0}
td.nm{min-width:170px}
.acts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}.acts a{white-space:nowrap}
.field.compact{min-width:120px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.steps span{border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:13px;background:var(--panel)}
.steps span.on{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{height:12px;background:var(--fill2);border-radius:3px;margin:6px 0}
/* Inicio de sesión */
.login{min-height:calc(100vh - 26px);display:flex;align-items:center;justify-content:center}
.login .box{width:430px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px}
/* Diálogos */
.ov{position:fixed;inset:26px 0 0 0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:70px;z-index:50}
.dlg{background:var(--panel);border:2px solid var(--text);border-radius:var(--radius);width:560px;max-width:92vw;padding:20px 22px}
.dlg h2{margin-top:0}
/* Panel del prototipo (no forma parte del diseño) */
#proto{position:fixed;right:12px;bottom:12px;z-index:100;font-size:12.5px;font-family:Arial,sans-serif}
#proto .t{background:#000;color:#fff;border:none;border-radius:16px;padding:6px 12px;cursor:pointer;font-size:12.5px;min-height:0}
#proto .p{display:none;background:#fff;border:2px solid #000;border-radius:6px;padding:10px;width:300px;max-height:70vh;overflow:auto;margin-bottom:6px}
#proto.open .p{display:block}
#proto .p a{display:inline-block;margin:2px 4px 2px 0;font-size:12px}
#proto h4{margin:8px 0 3px;font-size:12.5px}
body.captura #proto{display:none}
@media (max-width:1300px){.app{grid-template-columns:190px 1fr}.content{padding:14px 16px}.split{grid-template-columns:1fr}}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div id="proto"><div class="p" id="protoPanel"></div><button class="t" id="protoBtn">Panel del prototipo</button></div>
<script>
/* =====================================================================
   SIGEDA · Prototipo navegable P-02 (desechable, horizontal, fidelidad media)
   Una sola fuente: inventario (SCREENS), estados (STATES), diálogos (DIALOGS)
   y mapa de navegación (NAV). Todos los datos son FICTICIOS (Ley 8968).
   ===================================================================== */

const INVENTARIO = [
 {id:"PAN-01",nombre:"Inicio de sesión",clase:"PantallaInicioSesion"},
 {id:"PAN-02",nombre:"Menú principal (Inicio)",clase:"— (marco de navegación)"},
 {id:"PAN-03",nombre:"Buscar expediente",clase:"PantallaBusquedaExpedientes"},
 {id:"PAN-04",nombre:"Detalle del expediente",clase:"PantallaExpediente"},
 {id:"PAN-05",nombre:"Cargar documento",clase:"PantallaCargaDocumento"},
 {id:"PAN-06",nombre:"Registrar o modificar abonado y personas",clase:"PantallaExpediente (modo edición)"},
 {id:"PAN-07",nombre:"Panel de completitud",clase:"PantallaCompletitud"},
 {id:"PAN-08",nombre:"Respaldo y restauración",clase:"PantallaRespaldos"},
 {id:"PAN-09",nombre:"Importar datos de SADA",clase:"PantallaImportacion"},
 {id:"PAN-10",nombre:"Tipos de documento",clase:"PantallaTiposDocumento"},
 {id:"PAN-11",nombre:"Bitácora",clase:"PantallaBitacora"},
 {id:"PAN-12",nombre:"Exportar documentos",clase:"PantallaExportacion"},
 {id:"PAN-13",nombre:"Historial de versiones",clase:"PantallaHistorialVersiones"},
 {id:"PAN-14",nombre:"Mi cuenta",clase:"PantallaGestionCuenta"},
 {id:"PAN-15",nombre:"Revisar posibles duplicados",clase:"PantallaDuplicados (propuesta, Anexo B)"}
];

/* Mapa de navegación: [origen, destino, acción]. "*" = desde el menú lateral (todas las pantallas). */
const NAV = [
 ["PAN-01","PAN-02","Ingresar"],
 ["PAN-01","PAN-01","Contraseña temporal → cambiarla"],
 ["*","PAN-02","Inicio"],["*","PAN-03","Buscar expediente"],["*","PAN-06","Nuevo abonado"],
 ["*","PAN-07","Completitud"],["*","PAN-09","Importar SADA"],["*","PAN-15","Posibles duplicados"],
 ["*","PAN-10","Tipos de documento"],["*","PAN-11","Bitácora"],["*","PAN-08","Respaldos"],
 ["*","PAN-14","Mi cuenta"],["*","PAN-01","Cerrar sesión"],
 ["PAN-02","PAN-08","Aviso de respaldo → Ir a respaldos"],
 ["PAN-02","PAN-07","Ver avance de digitalización"],
 ["PAN-02","PAN-05","Cargar documento"],
 ["PAN-02","PAN-04","Últimos expedientes → Abrir"],
 ["PAN-03","PAN-04","Abrir expediente"],
 ["PAN-03","PAN-06","Registrar abonado (sin resultados)"],
 ["PAN-04","PAN-05","Cargar documento / Nueva versión"],
 ["PAN-04","PAN-13","Ver versiones"],
 ["PAN-04","PAN-06","Modificar abonado / Cambiar titular"],
 ["PAN-04","PAN-12","Exportar"],
 ["PAN-04","PAN-07","Ver qué falta"],
 ["PAN-04","D-01","Anular"],["D-01","PAN-04","Anular (confirmado)"],
 ["PAN-04","D-02","Editar datos"],["D-02","PAN-04","Guardar"],
 ["PAN-04","D-03","Dar de baja / Reactivar"],["D-03","PAN-04","Confirmar"],
 ["PAN-05","PAN-04","Guardar / Cancelar"],
 ["PAN-05","D-07","Cancelar con datos escritos"],["D-07","PAN-04","Salir sin guardar"],
 ["PAN-06","PAN-04","Guardar"],
 ["PAN-06","D-04","Cambiar titular"],["D-04","PAN-04","Confirmar cambio"],
 ["PAN-06","PAN-05","Cargar documentos (tras registrar)"],
 ["PAN-07","PAN-05","Cargar lo que falta"],
 ["PAN-07","PAN-04","Abrir expediente"],
 ["PAN-07","PAN-06","Asignar tipo (tipo pendiente)"],
 ["PAN-08","D-05","Restaurar…"],["D-05","PAN-08","Restaurar (confirmado)"],
 ["PAN-09","PAN-15","Revisar posibles duplicados"],
 ["PAN-09","PAN-07","Ver abonados con tipo pendiente"],
 ["PAN-15","D-06","Fusionar"],["D-06","PAN-15","Fusionar (confirmado)"],
 ["PAN-15","PAN-04","Abrir expediente"],
 ["PAN-11","PAN-04","Abrir expediente"],
 ["PAN-12","PAN-04","Exportar / Volver"],
 ["PAN-13","PAN-04","Volver al expediente"],
 ["PAN-13","PAN-05","Cargar nueva versión"],
 ["*","D-08","15 min sin actividad"],["D-08","PAN-01","Sesión cerrada"]
];

const DIALOGOS = {
 "D-01":"Anular documento","D-02":"Editar datos del documento","D-03":"Dar de baja o reactivar abonado",
 "D-04":"Cambiar titular","D-05":"Confirmar restauración","D-06":"Fusionar personas",
 "D-07":"Salir sin guardar","D-08":"Sesión por cerrarse"
};

/* Estados que se pueden ver en cada pantalla (panel del prototipo y capturas) */
const STATES = {
 "PAN-01":["inicial","error","bloqueada","temporal"],
 "PAN-02":["inicial","aviso"],
 "PAN-03":["inicial","exito","sin-resultados","error","cargando","mas-de-50","documentos"],
 "PAN-04":["exito","vacio","error","cargando","cargado","anulados"],
 "PAN-05":["inicial","seleccionado","error","cargando","exito","version"],
 "PAN-06":["nuevo","modificar","error","cargando","exito","importado"],
 "PAN-07":["exito","vacio","sin-resultados","cargando","detalle"],
 "PAN-08":["exito","vacio","error","pendiente","cargando","hecho"],
 "PAN-09":["inicial","vista-previa","error","cargando","exito"],
 "PAN-10":["inicial","error","exito"],
 "PAN-11":["inicial","sin-resultados","detalle"],
 "PAN-12":["inicial","error","exito"],
 "PAN-13":["inicial"],
 "PAN-14":["inicial","error","temporal"],
 "PAN-15":["inicial","vacio","exito"]
};

/* ----------------------- Datos ficticios ----------------------- */
/* Identificaciones con tomo 0000 (no existe en el Registro Civil): no pueden coincidir con personas reales. */
const HOY="04/11/2026";
const ABONADOS=[
 {paja:"0412",titular:"Ana Lucía Mora Vega",id:"1-0000-0123",sector:"Bodegas",tipo:"Persona física",estado:"Activo",comp:"Incompleto",faltan:["Certificación de registro de propiedad","Copia de cédula (cotitular Esteban Mora Vega)"]},
 {paja:"0413",titular:"Inversiones Cerro Azul Ficticia S.A.",id:"3-101-000777",sector:"Bodegas",tipo:"Persona jurídica",estado:"Activo",comp:"Completo",faltan:[]},
 {paja:"0255",titular:"Marta Elena Mora Ulate",id:"1-0000-0654",sector:"Trapiche",tipo:"Persona física",estado:"Activo",comp:"Incompleto",faltan:["Plano legible","Contrato de servicio"]},
 {paja:"0587",titular:"Carlos Alberto Mora Rojas",id:"4-0000-0789",sector:"Pilas",tipo:"Persona física",estado:"De baja",comp:"Completo",faltan:[]},
 {paja:"0730",titular:"Sofía Mora Quirós",id:"7-0000-0111",sector:"Calle Central",tipo:"Persona física",estado:"Activo",comp:"Incompleto",faltan:["Formulario de solicitud"]},
 {paja:"1021",titular:"José Antonio Mora Araya",id:"—",sector:"—",tipo:"Pendiente",estado:"Activo",comp:"Tipo pendiente",faltan:[]}
];
const mask = id => id==="—"?"—":id.replace(/^(\d)-(\d{3,4})-(\d+)$/,(m,a,b,c)=>a+"-"+"•".repeat(b.length)+"-"+c);

/* --------------------------- Utilidades --------------------------- */
const esc=s=>String(s);
function go(target){ return `href="#/${target}" data-go="${target}"`; }
function F(label,control,{req=false,hint="",err=""}={}){
  return `<div class="field"><label>${label} ${req?'<span class="req">(obligatorio)</span>':'<span class="req">(opcional)</span>'}</label>${control}${err?`<div class="errtxt">${err}</div>`:""}${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function FT(rows){ return `<div class="tablewrap ftable"><table><colgroup><col style="width:22%"><col style="width:20%"><col style="width:24%"><col style="width:14%"><col style="width:13%"><col style="width:7%"></colgroup><thead><tr><th>Archivo</th><th>Tipo de documento <span class="req">(oblig.)</span></th><th>Persona que lo aporta <span class="req">(oblig.)</span></th><th>Nombre identificador <span class="req">(opcional)</span></th><th>Fecha del documento <span class="req">(oblig.)</span></th><th></th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`; }
function FL(label,control,hint=""){ return `<div class="field"><label>${label}</label>${control}${hint?`<div class="hint">${hint}</div>`:""}</div>`; }
function T(head,rows){ return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`; }
function M(kind,title,body){ return `<div class="msg ${kind}" role="${kind==='error'?'alert':'status'}"><b>${title}</b>${body||""}</div>`; }
function sectorSel(v="Todos"){ return `<select>${["Todos","Bodegas","Pilas","Calle Cerro","Calle Central","Trapiche"].map(s=>`<option ${s===v?"selected":""}>${s}</option>`).join("")}</select>`; }
const TIPOS=[[1,"Plano legible","Ambas",""],[2,"Formulario de solicitud","Ambas",""],[3,"Copia de cédula","Persona física","Sí"],[4,"Certificación de registro de propiedad","Persona física",""],[5,"Contrato de servicio","Ambas",""],[6,"Cédula jurídica","Persona jurídica",""],[7,"Personería jurídica vigente","Persona jurídica",""],[8,"Cédula de la persona apoderada","Persona jurídica",""],[9,"Permiso de construcción vigente","Grupo: permiso o formulario (jurídica)",""],[10,"Formulario de construcción y uso del agua","Grupo: permiso o formulario (jurídica)",""],[11,"Boletas de trabajo","No obligatorio",""],[12,"Recibos por cobros especiales","No obligatorio",""],[13,"Conexiones ilegales","No obligatorio",""],[14,"Fotos del inmueble","No obligatorio",""]];
function tipoSel(v=""){ return `<select><option value="">Elija el tipo…</option>${TIPOS.map(t=>`<option ${t[1]===v?"selected":""}>${t[1]}</option>`).join("")}</select>`; }
function compTag(c){ return c==="Completo"?`<span class="tag ok">✓ Completo</span>`:c==="Tipo pendiente"?`<span class="tag pend dash">Tipo pendiente</span>`:`<span class="tag no strong">Incompleto</span>`; }
function estTag(e){ return e==="De baja"?`<span class="tag strong">De baja</span>`:`<span class="tag">Activo</span>`; }

/* ---------------------------- Marco ---------------------------- */
const MENU=[["PAN-02","Inicio"],["PAN-03","Buscar expediente"],["PAN-06","Nuevo abonado"],["PAN-07","Completitud"],null,["PAN-09","Importar SADA"],["PAN-15","Posibles duplicados"],["PAN-10","Tipos de documento"],null,["PAN-11","Bitácora"],["PAN-08","Respaldos"],["PAN-14","Mi cuenta"]];
const PARENT={"PAN-04":"PAN-03","PAN-05":"PAN-03","PAN-12":"PAN-03","PAN-13":"PAN-03"};
function band(){
  const hifi=document.body.classList.contains("hifi");
  return `<div class="band"><span>${hifi?"MAQUETA DE ALTA FIDELIDAD (P-04) · solo muestra el aspecto: no funciona":"PROTOTIPO DESECHABLE P-02 · wireframe de fidelidad media · no es el sistema"}</span><span>Datos ficticios · ${current.id}${current.st?" · estado: "+current.st:""}</span></div>`;
}
function shell(id,html){
  const on=PARENT[id]||id;

  const docs=DOCS0412.filter(d=>d.est==="Vigente").map((d,i)=>`<tr><td><input type="checkbox" ${i<3?"checked":""} style="min-height:0"></td><td>${d.tipo}</td><td>${d.nom}</td><td>${d.fd}</td></tr>`);
  return shell("PAN-12",`<div class="crumb"><a ${go("PAN-04")}>Expediente 0412</a> › Exportar</div><h1>Exportar documentos</h1><p class="sub">Para una solicitud de la Junta Directiva o de una entidad con facultad legal (por ejemplo, ARESEP).</p>
  ${st==="error"?M("error","No se pudo copiar a la carpeta E:\\Solicitud ARESEP: no hay espacio suficiente.","Elija otra carpeta o libere espacio y vuelva a exportar. No se copió ningún archivo."):""}
  ${st==="exito"?M("ok","Se exportaron 3 documentos a C:\\Exportaciones\\0412_04-11-2026.","La exportación quedó en la bitácora. Los archivos exportados ya no están cifrados: entréguelos solo a quien corresponda."):""}
  <div class="split"><div>${T(["","Tipo","Nombre identificador","Fecha del documento"],docs)}</div>
  <div class="panel"><h2 style="margin-top:0">Destino</h2><label style="display:block"><input type="radio" checked name="d" style="min-height:0"> Copiar a una carpeta</label><div class="row" style="margin:6px 0 10px 24px"><input value="C:\\Exportaciones\\0412_04-11-2026"><a class="btn sm" href="#">Elegir…</a></div><label style="display:block"><input type="radio" name="d" style="min-height:0"> Imprimir</label>
  ${M("warn","Los datos de las personas solo se entregan a quien tenga facultad legal (RN-10).","")}
  <div class="actions"><a class="btn" ${go("PAN-04")}>Cancelar</a><a class="btn pri" ${go("PAN-12?estado=exito")}>Exportar 3 documentos</a></div></div></div>`);
};

SCREENS["PAN-13"]=st=>shell("PAN-13",`<div class="crumb"><a ${go("PAN-04")}>Expediente 0412</a> › Versiones</div><h1>Versiones · Formulario de solicitud</h1><p class="sub">Expediente 0412 · Solicitud de servicio · Ninguna versión se borra ni se sobrescribe.</p>
 <div class="split"><div>${T(["Versión","Fecha del documento","Cargada el","Por","Archivo",""],[
  `<tr class="sel"><td><b>v2 · vigente</b></td><td>10/02/2026</td><td>04/11/2026 09:20</td><td>secretaria</td><td>formulario_2026.pdf · 0,8 MB</td><td><a class="btn sm" href="#">Ver</a></td></tr>`,
  `<tr><td>v1</td><td>15/03/2005</td><td>04/11/2026 09:05</td><td>secretaria</td><td>formulario_2005.pdf · 1,1 MB</td><td><a class="btn sm" href="#">Ver</a></td></tr>`])}
  <div class="actions"><a class="btn" ${go("PAN-04")}>Volver al expediente</a><a class="btn pri" ${go("PAN-05?estado=version")}>Cargar nueva versión</a></div></div>
  <div><div class="viewer"><div class="ph"></div><b>v2 · Formulario de solicitud</b><span class="hint">Fecha del documento 10/02/2026</span></div></div></div>`);

SCREENS["PAN-14"]=st=>shell("PAN-14",`<h1>Mi cuenta</h1><p class="sub">Sesión de <b>secretaria</b> (Secretaría). Las dos cuentas tienen los mismos permisos.</p>
 ${st==="error"?M("error","La contraseña nueva tiene 6 caracteres y el mínimo es 8.","Escriba una contraseña de al menos 8 caracteres."):""}
 <div class="grid2"><div class="panel"><h2 style="margin-top:0">Cambiar mi contraseña</h2>
  ${F("Contraseña actual",`<input type="password" value="••••••••">`,{req:true})}
  ${F("Contraseña nueva",`<input type="password" value="${st==="error"?"••••••":""}" class="${st==="error"?"bad":""}">`,{req:true,hint:"Mínimo 8 caracteres."})}
  ${F("Repita la contraseña nueva",`<input type="password">`,{req:true})}
  <div class="actions"><a class="btn pri" ${go("PAN-14?estado=error")}>Cambiar contraseña</a></div></div>
 <div class="panel"><h2 style="margin-top:0">Contraseña temporal para la otra usuaria</h2><p class="hint">Úselo si la administradora olvidó su contraseña o su cuenta quedó bloqueada.</p>
  ${F("Cuenta",`<select disabled><option>administradora</option></select>`)}
  ${st==="temporal"?M("ok","Contraseña temporal de «administradora»: Rio-7425-Agua","Désela en persona. Solo se muestra esta vez y deberá cambiarla al entrar. Quedó en la bitácora."):""}
  <div class="actions"><a class="btn" ${go("PAN-14?estado=temporal")}>Generar contraseña temporal</a></div></div></div>`);

SCREENS["PAN-15"]=st=>{
  if(st==="vacio") return shell("PAN-15",`<h1>Revisar posibles duplicados</h1>${M("ok","No hay personas repetidas por revisar.","Cuando importe de nuevo desde SADA, aquí aparecerán los nombres que se repitan.")}`);
  return shell("PAN-15",`<h1>Revisar posibles duplicados</h1><p class="sub">Personas con el mismo nombre en distintas pajas. Usted decide si son la misma persona; SIGEDA nunca las une solo.</p>
  ${st==="exito"?M("ok","Se unieron las 2 fichas de «José Antonio Mora Araya».","Ahora es titular de las pajas 1021 y 0215. Cada cambio quedó en la bitácora."):""}
  <p class="hint">17 grupos por revisar</p>
  <div class="panel"><h2 style="margin-top:0">JOSÉ ANTONIO MORA ARAYA · 2 fichas</h2>${T(["","Nombre","Identificación","Pajas y rol","Origen",""],[
   `<tr><td><input type="radio" name="k" checked style="min-height:0"> Conservar</td><td>José Antonio Mora Araya</td><td>1-0000-0345</td><td>0215 · titular</td><td>Registro manual</td><td><a ${go("PAN-04")}>Abrir</a></td></tr>`,
   `<tr><td><input type="radio" name="k" style="min-height:0"> Conservar</td><td>JOSE ANTONIO MORA ARAYA</td><td>—</td><td>1021 · titular</td><td>Importado de SADA 02/11/2026</td><td><a ${go("PAN-04")}>Abrir</a></td></tr>`])}
   <div class="actions"><a class="btn pri" href="#" data-dlg="D-06">Son la misma persona: unir</a><a class="btn" ${go("PAN-15")}>Revisar después</a></div></div>
  <div class="panel"><h2 style="margin-top:0">MARÍA FERNANDA SOLÍS ROJAS · 2 fichas</h2><p class="hint">0301 · titular · 1-0000-0567 &nbsp;|&nbsp; 0844 · cotitular · sin identificación</p></div>`);
};

/* --------------------------- Diálogos --------------------------- */
const DLG={
 "D-01":()=>`<h2>Anular documento</h2><p><b>Copia de cédula · Ana Lucía Mora Vega · 10/02/2026</b></p><p>El documento no se borra: deja de verse en el expediente y no cuenta para la completitud. Se puede ver con «Mostrar anulados».</p>${F("Motivo de la anulación",`<textarea rows="3">Se cargó la cédula de otra persona</textarea>`,{req:true})}<p class="hint">El motivo y la fecha de hoy (${HOY}) quedan en la bitácora.</p><div class="actions"><a class="btn" data-close href="#">Cancelar</a><a class="btn danger" ${go("PAN-04?estado=anulados")}>Anular documento</a></div>`,
 "D-02":()=>`<h2>Editar datos del documento</h2>${F("Tipo de documento",tipoSel("Formulario de solicitud"),{req:true})}${F("Nombre identificador",`<input value="Solicitud de servicio">`)}<p class="hint">El archivo, la fecha del documento y las versiones anteriores no cambian. El valor anterior y el nuevo quedan en la bitácora.</p><div class="actions"><a class="btn" data-close href="#">Cancelar</a><a class="btn pri" ${go("PAN-04")}>Guardar</a></div>`,
 "D-03":()=>`<h2>Dar de baja el abonado 0412</h2><p>El expediente y sus documentos se conservan y se pueden consultar. El abonado deja de contar en el panel de completitud. Puede reactivarlo después.</p>${F("Fecha de la baja",`<input value="${HOY}">`,{req:true,hint:"dd/mm/aaaa"})}<div class="actions"><a class="btn" data-close href="#">Cancelar</a><a class="btn danger" ${go("PAN-04")}>Dar de baja</a></div>`,
 "D-04":()=>`<h2>Cambiar titular · paja 0412</h2><p>Titular actual: <b>Ana Lucía Mora Vega</b></p>${F("Nuevo titular",`<input value="Esteban Mora Vega (cotitular, 2-0000-0456)">`,{req:true,hint:"Busque una persona registrada o agregue una nueva."})}${F("Fecha del cambio",`<input value="${HOY}">`,{req:true,hint:"dd/mm/aaaa"})}${M("warn","Ana Lucía Mora Vega dejará de verse como titular en búsquedas y pantallas.","Queda en el historial de titulares con fecha fin 04/11/2026. Sus documentos se conservan. El tipo de abonado no cambia.")}<div class="actions"><a class="btn" data-close href="#">Cancelar</a><a class="btn pri" ${go("PAN-04")}>Confirmar cambio de titular</a></div>`,
 "D-05":()=>`<h2>Restaurar un respaldo</h2>${F("Respaldo",`<select><option>02/11/2026 16:30 · Completo · 1,7 GB</option></select>`,{req:true})}${M("error","Se reemplazarán TODOS los abonados y documentos actuales por los del 02/11/2026.","Lo que se haya hecho después de esa fecha se perderá. Antes de restaurar, SIGEDA hace un respaldo del estado actual. La bitácora no se borra.")}${F("Clave de cifrado",`<input type="password" placeholder="Copia física o digital de la clave">`,{req:true})}${F("Escriba RESTAURAR para confirmar",`<input>`,{req:true})}<div class="actions"><a class="btn" data-close href="#">Cancelar</a><a class="btn danger" ${go("PAN-08?estado=hecho")}>Restaurar</a></div>`,
 "D-06":()=>`<h2>Unir dos fichas de persona</h2><p>Se conserva <b>José Antonio Mora Araya (1-0000-0345)</b>. La ficha importada de SADA pasa sus vínculos y documentos a esta y deja de aparecer en las búsquedas. No se borra nada.</p><p class="hint">Cada cambio queda en la bitácora. Esta acción no se puede deshacer desde SIGEDA.</p><div class="actions"><a class="btn" data-close href="#">Cancelar</a><a class="btn danger" ${go("PAN-15?estado=exito")}>Unir fichas</a></div>`,
 "D-07":()=>`<h2>¿Salir sin guardar?</h2><p>Eligió 2 archivos y escribió sus datos. Si sale ahora, no se guarda nada.</p><div class="actions"><a class="btn" data-close href="#">Seguir cargando</a><a class="btn danger" ${go("PAN-04")}>Salir sin guardar</a></div>`,
 "D-08":()=>`<h2>Su sesión se va a cerrar</h2><p>Lleva casi 15 minutos sin usar SIGEDA. Por seguridad, la sesión se cerrará en <b>60 segundos</b>. Lo que no haya guardado se perderá.</p><div class="actions"><a class="btn" ${go("PAN-01")}>Cerrar sesión</a><a class="btn pri" data-close href="#">Seguir trabajando</a></div>`
};
const DLG_HOST={"D-01":"PAN-04","D-02":"PAN-04","D-03":"PAN-04","D-04":"PAN-06?estado=modificar","D-05":"PAN-08","D-06":"PAN-15","D-07":"PAN-05?estado=seleccionado","D-08":"PAN-03?estado=exito"};

/* ---------------------------- Router ---------------------------- */
let current={id:"PAN-01",st:"",dlg:""};
function parse(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,""))||"PAN-01";
  const [id,q]=h.split("?"); const p=new URLSearchParams(q||"");
  return {id:SCREENS[id]?id:"PAN-01",st:p.get("estado")||"",dlg:p.get("dlg")||""};
}
function render(){
  current=parse();
  const sp=new URLSearchParams(location.search);
  document.body.classList.toggle("hifi",sp.get("hifi")==="1"||localStorage_get("hifi")==="1");
  document.body.classList.toggle("captura",sp.get("captura")==="1");
  const st=current.st||STATES[current.id][0];
  document.getElementById("root").innerHTML=SCREENS[current.id](st);
  if(current.dlg&&DLG[current.dlg]) openDlg(current.dlg,false);
  document.title=`SIGEDA · ${current.id} ${INVENTARIO.find(s=>s.id===current.id).nombre}`;
  buildPanel(); window.scrollTo(0,0);
}
function localStorage_get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function localStorage_set(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function openDlg(id){
  const ov=document.createElement("div"); ov.className="ov"; ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><div class="hint" style="float:right">${id}</div>${DLG[id]()}</div>`;
  document.body.appendChild(ov);
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-dlg]");
  if(d&&d.dataset.dlg){ e.preventDefault(); openDlg(d.dataset.dlg); return; }
  const c=e.target.closest("[data-close]");
  if(c){ e.preventDefault(); document.querySelectorAll(".ov").forEach(o=>o.remove()); return; }
  const a=e.target.closest("a[href='#']"); if(a){ e.preventDefault(); }
});
window.addEventListener("hashchange",()=>{document.querySelectorAll(".ov").forEach(o=>o.remove());render();});

/* Panel del prototipo: no es parte del diseño; sirve para recorrer pantallas, estados y diálogos */
function buildPanel(){
  const st=STATES[current.id]||[];
  document.getElementById("protoPanel").innerHTML=`<b>${current.id} · ${INVENTARIO.find(s=>s.id===current.id).nombre}</b>
  <h4>Estados de esta pantalla</h4>${st.map(s=>`<a href="#/${current.id}?estado=${s}">${s}</a>`).join(" ")}
  <h4>Pantallas</h4>${INVENTARIO.map(s=>`<a href="#/${s.id}" title="${s.nombre}">${s.id}</a>`).join(" ")}
  <h4>Diálogos</h4>${Object.keys(DIALOGOS).map(k=>`<a href="#/${DLG_HOST[k]}${DLG_HOST[k].includes("?")?"&":"?"}dlg=${k}" title="${DIALOGOS[k]}">${k}</a>`).join(" ")}
  <h4>Aspecto</h4><a href="#" id="tg">${document.body.classList.contains("hifi")?"Ver wireframe (gris)":"Ver maqueta de alta fidelidad"}</a>`;
  document.getElementById("tg").onclick=e=>{e.preventDefault();const on=!document.body.classList.contains("hifi");localStorage_set("hifi",on?"1":"0");const u=new URL(location.href);u.searchParams.delete("hifi");history.replaceState(null,"",u);render();};
}
document.getElementById("protoBtn").onclick=()=>document.getElementById("proto").classList.toggle("open");
render();
</script>
