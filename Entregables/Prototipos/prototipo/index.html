<html lang="es-CR">
<head>

<title>SIGEDA · Prototipo navegable (P-02)</title>

<style>
/* ===== Wireframe (fidelidad media, en gris; el color solo marca estados) ===== */
:root{
  --bg:#ececec; --panel:#ffffff; --line:#8c8c8c; --line-soft:#c8c8c8;
  --text:#1e1e1e; --muted:#4d4d4d; --primary:#2e2e2e; --primary-text:#ffffff;
  --secondary:#ffffff; --fill:#f5f5f5; --fill2:#e0e0e0;
  --chip:#e6e6e6; --band:#1e1e1e; --band-text:#ffffff;
  /* Colores de estado (también en el wireframe, siempre con texto) */
  --ok:#2f7a45; --ok-bg:#e6f2ea; --warn:#7a5600; --warn-bg:#fff4d6; --err:#a61b1b; --err-bg:#fbe9e9;
  --font:"Segoe UI", Arial, Helvetica, sans-serif; --radius:4px;
}
body.hifi{
  --bg:#eef3f6; --panel:#ffffff; --line:#9fb3c2; --line-soft:#d5e0e8;
  --text:#14212b; --muted:#43545f; --primary:#0b5c8a; --primary-text:#ffffff;
  --secondary:#ffffff; --fill:#f6f9fb; --fill2:#dbe7ef;
  --chip:#e3edf4; --band:#7a4b00; --band-text:#ffffff; --radius:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--text);background:var(--bg);min-width:1280px}
a{color:var(--text)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.band{background:var(--band);color:var(--band-text);font-size:13px;padding:4px 14px;display:flex;justify-content:space-between;gap:12px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 26px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column}
.brand{padding:0 16px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.brand b{font-size:20px;letter-spacing:.5px}
.brand div{font-size:12.5px;color:var(--muted)}
.nav a{display:block;padding:9px 16px;text-decoration:none;border-left:4px solid transparent;font-size:14.5px}
.nav a:hover{background:var(--fill)}
.nav a.on{border-left-color:var(--primary);background:var(--fill2);font-weight:600}
.nav .sep{height:1px;background:var(--line-soft);margin:8px 16px}
.side .foot{margin-top:auto;padding:10px 16px;font-size:12.5px;color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:16px}
.top .quick{flex:1;display:flex;gap:6px;max-width:520px}
.top .quick input{flex:1}
.top .who{margin-left:auto;text-align:right;font-size:13.5px}
.chipbk{font-size:12.5px;border:1px solid var(--line);border-radius:12px;padding:2px 10px;background:var(--fill);white-space:nowrap;text-decoration:none}
.chipbk.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.chipbk.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);font-weight:600}
.chipbk.err{border-color:var(--err);background:var(--err-bg);color:var(--err);font-weight:600}
.content{padding:18px 22px 40px;overflow:auto}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:15px;margin:12px 0 6px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:160px;flex:1}
.field label,.field .lbl{font-weight:600;font-size:14px}
.req{font-weight:400;color:var(--muted);font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14.5px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--text);min-height:36px}
input[disabled],select[disabled]{background:var(--fill2);color:var(--muted)}
input.bad,select.bad{border:2px solid var(--err)}
.errtxt{font-size:13px;font-weight:600;color:var(--err)}
.errtxt::before{content:"⚠ "}
button,.btn{font:inherit;font-size:14.5px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--primary);background:var(--secondary);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block;min-height:38px;line-height:20px;white-space:nowrap}
.btn.pri,button.pri{background:var(--primary);color:var(--primary-text);font-weight:600}
.btn.link{border-color:transparent;background:transparent;text-decoration:underline;padding:8px 6px}
.btn.danger{border:2px solid var(--err);font-weight:600}
.btn.sm{font-size:13px;padding:4px 10px;min-height:30px}
.btn[aria-disabled=true],button[disabled]{opacity:.45;pointer-events:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);font-size:14px}
th,td{border-bottom:1px solid var(--line-soft);padding:8px 9px;text-align:left;vertical-align:top}
th{background:var(--fill2);font-weight:600;border-bottom:1px solid var(--line)}
tr.muted td{color:var(--muted)}
tr.sel td{background:var(--fill)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:12.5px;background:var(--chip);white-space:nowrap;margin:1px 2px 1px 0}
.tag.strong{border:2px solid var(--text);font-weight:600}
.tag.dash{border-style:dashed}
.tag.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.tag.no{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.tag.pend{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.tag.prop{background:#fff;border:1px dashed var(--muted);font-style:italic}
.msg{border:1px solid var(--line);border-left:6px solid var(--muted);padding:10px 14px;border-radius:var(--radius);margin:0 0 14px;background:var(--fill)}
.msg b{display:block;margin-bottom:2px}
.msg.error{border-left-color:var(--err);background:var(--err-bg);border-width:2px 2px 2px 6px}
.msg.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.msg.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 18px;text-decoration:none;border:1px solid transparent;border-bottom:none;margin-bottom:-1px;border-radius:var(--radius) var(--radius) 0 0}
.tabs a.on{border-color:var(--line);background:var(--panel);font-weight:600}
.kpi{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:12px 14px}
.kpi .n{font-size:26px;font-weight:700}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.ok{border-left:6px solid var(--ok)} .kpi.no{border-left:6px solid var(--err)} .kpi.pend{border-left:6px solid var(--warn)}
.bar{height:14px;border:1px solid var(--line);border-radius:7px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted)}
body.hifi .bar i{background:#0b5c8a}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;background:var(--fill)}
.viewer{border:1px solid var(--line);background:var(--fill2);min-height:330px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);text-align:center;padding:12px}
.ph{background:repeating-linear-gradient(45deg,var(--fill2),var(--fill2) 8px,var(--fill) 8px,var(--fill) 16px);border:1px solid var(--line);width:72%;height:220px}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px}
.ftable table{table-layout:fixed}.ftable select,.ftable input{width:100%;min-width:0}
td.nm{min-width:170px}
.acts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}.acts a{white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.steps span{border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:13px;background:var(--panel)}
.steps span.on{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{height:12px;background:var(--fill2);border-radius:3px;margin:6px 0}
.login{min-height:calc(100vh - 26px);display:flex;align-items:center;justify-content:center}
.login .box{width:430px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px}
.login h1.brandh{font-size:24px}
/* Diálogos nativos */
dialog.dlg{border:2px solid var(--text);border-radius:var(--radius);width:560px;max-width:92vw;padding:20px 22px;background:var(--panel);color:var(--text)}
dialog.dlg::backdrop{background:rgba(0,0,0,.45)}
dialog.dlg h2{margin-top:0}
/* Panel del prototipo (no forma parte del diseño) */
#proto{position:fixed;right:12px;bottom:12px;z-index:100;font-size:12.5px;font-family:Arial,sans-serif}
#proto .t{background:#000;color:#fff;border:none;border-radius:16px;padding:6px 12px;cursor:pointer;font-size:12.5px;min-height:0}
#proto .p{display:none;background:#fff;border:2px solid #000;border-radius:6px;padding:10px;width:300px;max-height:70vh;overflow:auto;margin-bottom:6px}
#proto.open .p{display:block}
#proto .p a{display:inline-block;margin:2px 4px 2px 0;font-size:12px}
#proto .ph4{margin:8px 0 3px;font-size:12.5px;font-weight:700}
body.captura #proto{display:none}
.ovbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
</style>
</head>

<script>

};
const DLG_HOST={"D-01":"PAN-04","D-02":"PAN-04","D-03":"PAN-04","D-04":"PAN-06?estado=modificar","D-05":"PAN-08","D-06":"PAN-06?estado=modificar","D-07":"PAN-05?estado=seleccionado","D-08":"PAN-03?estado=exito"};

const STATES = {
 "PAN-01":["inicial","error","bloqueada","temporal"],

/* ----------------------- Datos ficticios ----------------------- */
/* Identificaciones con tomo 0000 (no existe en el Registro Civil). Hoy = 04/11/2026 (miércoles). */
const HOY="04/11/2026";

 ABONADOS[1],ABONADOS[2]

const mask = id => id==="—"?"—":id.replace(/^(\d)-(\d{3,4})-(\d+)$/,(m,a,b,c)=>a+"-"+"•".repeat(b.length)+"-"+c);

 ["03/11/2026 16:30","Automático","Completo","1,8 GB"],["02/11/2026 16:30","Automático","Completo","1,7 GB"],
 ["01/11/2026 11:05","Manual","Completo","1,7 GB"],["31/10/2026 16:30","Automático","Completo","1,7 GB"],
 ["30/10/2026 16:30","Automático","Completo","1,6 GB"],["29/10/2026 16:30","Automático","Completo","1,6 GB"],

/* --------------------------- Utilidades --------------------------- */
let FID=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(target){ return `href="#/${target}" data-go="${target}"`; }
function routeNoDlg(){ return `#/${current.id}${current.st?"?estado="+current.st:""}`; }
function dl(id,host){ const base=host||`${current.id}${current.st?"?estado="+current.st:""}`; return `href="#/${base}${base.includes("?")?"&":"?"}dlg=${id}" data-dlg="${id}"`; }
function withId(control){ const m=control.match(/<(?:input|select|textarea)[^>]*\bid="([^"]+)"/); if(m) return [m[1],control]; const id="f"+(++FID); return [id, control.replace(/<(input|select|textarea)/,`<$1 id="${id}"`)]; }
function F(label,control,{req=false,hint="",err=""}={}){
  const [id,c]=withId(control);
  return `<div class="field"><label for="${id}">${label} ${req?'<span class="req">(obligatorio)</span>':'<span class="req">(opcional)</span>'}</label>${c}${err?`<div class="errtxt">${err}</div>`:""}${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function FL(label,control,hint=""){ const [id,c]=withId(control); return `<div class="field"><label for="${id}">${label}</label>${c}${hint?`<div class="hint">${hint}</div>`:""}</div>`; }
function FX(label,html){ return `<div class="field"><span class="lbl">${label}</span>${html}</div>`; }
function T(head,rows,cap=""){ return `<div class="tablewrap"><table>${cap?`<caption class="sr-only">${cap}</caption>`:""}<thead><tr>${head.map(h=>`<th scope="col">${h||'<span class="sr-only">Acciones</span>'}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`; }

/* Estado del respaldo que muestra el encabezado (coherente con PAN-02 y PAN-08) */
function backupChip(){
  const k=current.id+"|"+(current.st||"");
  if(k==="PAN-02|aviso"||k==="PAN-08|pendiente") return ["warn","Último respaldo: 02/11/2026 16:30 · el de ayer quedó pendiente ⚠"];
  if(k==="PAN-08|error") return ["warn","Último respaldo: 03/11/2026 16:30 · el intento de hoy falló ⚠"];
  if(k==="PAN-08|hecho") return ["ok","Último respaldo: 04/11/2026 10:05 ✓"];
  if(k==="PAN-08|vacio") return ["err","Sin respaldos ✕"];
  return ["ok","Último respaldo: 03/11/2026 16:30 ✓"];
}

  let files="",msg="",act=`<a class="btn pri" ${go("PAN-05?estado=cargando")}>Guardar documentos</a>`;
  if(st==="inicial"){ act=`<a class="btn pri" aria-disabled="true">Guardar documentos</a>`; }

    files=FT(version?[fileRow("formulario_2026.pdf","PDF · 0,8 MB","Formulario de solicitud","Ana Lucía Mora Vega (titular)","Solicitud de servicio","10/02/2026")]:
     [fileRow("certificacion_registro.pdf","PDF · 1,3 MB","Certificación de registro de propiedad","Ana Lucía Mora Vega (titular)","","15/03/2005"),
      fileRow("cedula_esteban.png","PNG · 0,6 MB","Copia de cédula","Esteban Mora Vega (cotitular)","","10/02/2026")]);

     fileRow("foto_cedula.jpg","JPG · 2,4 MB","Copia de cédula","Esteban Mora Vega (cotitular)","","10/02/2026","Es un archivo JPG. Solo se aceptan PDF o PNG: conviértalo con la fotocopiadora o elija otro archivo."),

     fileRow("certificacion_registro.pdf","PDF · 1,3 MB","","Ana Lucía Mora Vega (titular)","","15/03/2005","Falta el tipo de documento. Elíjalo en la lista.")]);
  }
  if(st==="cargando"){ msg=`<div class="panel" role="status"><p style="margin:0 0 6px"><span class="spinner"></span>Cifrando y guardando el archivo 2 de 2…</p><div class="bar"><i style="width:60%"></i></div><p class="hint">No cierre SIGEDA. El botón se activa al terminar.</p></div>`; act=`<a class="btn pri" aria-disabled="true">Guardando…</a>`; }

    ${M("ok","Se cargó 1 documento al expediente 0412.","Certificación de registro de propiedad, con fecha del documento 15/03/2005. La carga quedó en la bitácora a nombre de la cuenta secretaria.")}
    <div class="actions"><a class="btn pri" ${go("PAN-04?estado=cargado")}>Ver expediente</a><a class="btn" ${go("PAN-05")}>Cargar otro documento</a></div>`); }
  const cancel = (st==="inicial"||st==="cargando") ? `<a class="btn" ${go("PAN-04")}>Cancelar</a>` : `<a class="btn" ${dl("D-07")}>Cancelar</a>`;
  return shell("PAN-05",`<div class="crumb"><a ${go("PAN-03?estado=exito")}>Buscar expediente</a> › <a ${go("PAN-04")}>Expediente 0412</a> › Cargar documento</div>
  <h1>Cargar documento</h1><p class="sub">Expediente <b>0412 · Ana Lucía Mora Vega</b> · Persona física · Bodegas <a class="btn sm link" ${go("PAN-03")}>Cambiar de expediente</a></p>${msg}

   <label style="display:block;margin:4px 0"><input type="radio" name="q" ${version?"checked":""} style="min-height:0"> Una <b>nueva versión</b> de un documento que ya está en el expediente</label>
   ${version?`<div style="margin:8px 0 0 26px;max-width:520px">${F("Documento del que es nueva versión",`<select><option>Formulario de solicitud · Solicitud de servicio · 15/03/2005 (v1)</option></select>`,{req:true,hint:"La versión anterior se conserva con su fecha; la nueva se muestra como vigente."})}</div>`:""}

  <div class="panel"><h2 style="margin-top:0">2. Archivos</h2>

   ${files?`<h3>3. Datos de cada archivo</h3><p class="hint">La fecha del documento se propone con la fecha de hoy (${HOY}). Si digitaliza un papel viejo, ponga la fecha que tiene el papel. La fecha y hora de carga se guardan solas y no se pueden cambiar.</p>`+files:`<p class="hint" style="margin-top:12px">Todavía no ha elegido archivos.</p>`}
  </div>

function FT(rows){ return `<div class="tablewrap ftable"><table><colgroup><col style="width:22%"><col style="width:20%"><col style="width:24%"><col style="width:14%"><col style="width:13%"><col style="width:7%"></colgroup><thead><tr><th scope="col">Archivo</th><th scope="col">Tipo de documento <span class="req">(oblig.)</span></th><th scope="col">Persona que lo aporta</th><th scope="col">Nombre identificador <span class="req">(opcional)</span></th><th scope="col">Fecha del documento <span class="req">(oblig.)</span></th><th scope="col"><span class="sr-only">Acciones</span></th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`; }

  const personas = nuevo?`<p class="hint">Aún no hay personas asociadas.</p>`:T(["Persona","Identificación","Rol","Desde","Hasta",""],[
     `<tr><td>Esteban Mora Vega</td><td>2-0000-0456</td><td><select aria-label="Rol de Esteban Mora Vega"><option>Cotitular</option><option>Apoderada</option></select></td><td>10/02/2026</td><td>—</td><td><a class="btn sm" ${go("PAN-06?estado=modificar")}>Quitar del expediente</a></td></tr>`],"Personas asociadas");

  <h1>${nuevo?"Registrar abonado":"Modificar abonado y personas"}</h1>

  ${e?M("error","No se pudo guardar: hay 2 datos por corregir.","Están marcados abajo con ⚠."):""}
  ${pe?M("warn","Ya existe una persona con la cédula física 1-0000-0123: Ana Lucía Mora Vega, titular de la paja 0412.",`Si es la misma persona, use sus datos registrados para no duplicarla. <a class="btn sm" ${go("PAN-06?estado=nuevo")}>Usar esa persona</a> <a class="btn sm link" ${go("PAN-06?estado=nuevo")}>Revisar el número</a>`):""}

  <div class="panel"><h2 style="margin-top:0">Datos del abonado</h2><div class="row">${pajaF}${F("Sector",sectorSel(nuevo||imp?"Elija el sector…":"Bodegas",true),{req:true})}${tipo}</div>

  <div class="panel"><h2 style="margin-top:0">Titular vigente</h2>

   :`<div class="row" style="align-items:center"><div style="flex:1"><b>${imp?"José Antonio Mora Araya":"Ana Lucía Mora Vega"}</b> · ${imp?"sin identificación":"1-0000-0123"} · titular desde ${imp?"14/09/2026":"10/02/2026"}</div><a class="btn" ${dl("D-04")}>Cambiar titular…</a></div>${imp?idF:""}

  </div>
  <div class="panel"><h2 style="margin-top:0">Personas asociadas (cotitulares y persona apoderada)</h2>${personas}

};

SCREENS["PAN-07"]=st=>{

  const load=st==="cargando";
  const kpis=`<div class="grid4">${k(load?"—":"312","Completos de 1 011 activos","ok")}${k(load?"—":"641","Incompletos de 1 011 activos","no")}${k(load?"—":"58","Tipo pendiente de 1 011 activos","pend")}${k(load?"—":"4","De baja (no cuentan en el avance)","")}</div>

  const rowsFull=[
   ["0412","Ana Lucía Mora Vega","Bodegas","Física",`<span class="tag no">Certificación de registro de propiedad</span><span class="tag no">Copia de cédula · cotitular Esteban</span>`],
   ["0255","Marta Elena Mora Ulate","Trapiche","Física",`<span class="tag no">Plano legible</span><span class="tag no">Contrato de servicio</span>`],

   ["0730","Sofía Mora Quirós","Calle Central","Física",`<span class="tag no">Formulario de solicitud</span>`]];
  const rows=rowsFull.map(r=>`<tr><td><b>${r[0]}</b></td><td class="nm">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${compTag("Incompleto")}</td><td>${r[4]}</td><td><a class="btn sm pri" ${go("PAN-05")}>Cargar lo que falta <span class="sr-only">de ${r[0]}</span></a> <a class="btn sm" ${go("PAN-04")}>Abrir <span class="sr-only">${r[0]}</span></a></td></tr>`);
  const pend=`<h2>Tipo pendiente (58) · importados de SADA el 14/09/2026</h2>${T(["Paja","Titular","Estado",""],[`<tr><td><b>1021</b></td><td>José Antonio Mora Araya</td><td>${compTag("Tipo pendiente")}</td><td><a class="btn sm" ${go("PAN-06?estado=importado")}>Asignar tipo</a></td></tr>`],"Abonados con tipo pendiente")}`;
  let body="";
  if(st==="vacio") body=M("info","Todavía no hay abonados registrados.",`Importe el listado de SADA para empezar a medir el avance. <a ${go("PAN-09")}>Importar SADA</a>`);
  else if(load) body=kpis+`<p role="status"><span class="spinner"></span>Calculando la completitud de 1 011 expedientes activos…</p>`;

     <div class="actions"><a class="btn" ${go("PAN-07")}>Volver al panel</a><a class="btn" ${go("PAN-04")}>Abrir expediente</a></div></div>`;
  else body=kpis+filt+`<h2>Incompletos (641) · por número de paja</h2>`+T(["Paja","Titular vigente","Sector","Tipo","Estado","Qué falta",""],rows,"Expedientes incompletos")+pend;

SCREENS["PAN-08"]=st=>{
  const hecho=st==="hecho", pend=st==="pendiente";
  let lista=RESPALDOS.slice();
  if(hecho) lista=[["04/11/2026 10:05","Manual","Completo","1,8 GB"],...lista.slice(0,8)];
  if(pend) lista=[["03/11/2026 16:30","Automático","Pendiente","—"],...lista.slice(1)];
  if(st==="error") lista=[["04/11/2026 10:05","Manual","Fallido","—"],...lista.slice(0,8)];
  const etq=e=>e==="Completo"?`<span class="tag ok">Completo</span>`:e==="Pendiente"?`<span class="tag pend">Pendiente</span>`:`<span class="tag no">Fallido</span>`;
  const hist=T(["Fecha y hora","Tipo","Estado","Disco externo","OneDrive","Tamaño"],lista.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${etq(r[2])}</td><td>${r[2]==="Completo"?"Verificada ✓":r[2]==="Pendiente"?"Disco no conectado":"La copia no coincide"}</td><td>No configurado</td><td>${r[3]}</td></tr>`),"Últimos respaldos");
  const ult = hecho?"04/11/2026 10:05 (hace unos segundos)":pend?"02/11/2026 16:30 (hace 2 días)":"03/11/2026 16:30 (hace 18 horas)";
  const prox = pend?"Reintentando cada 30 minutos: conecte el disco externo":"Hoy 16:30 · con el disco conectado";
  let estado=`<div class="panel"><h2 style="margin-top:0">Último respaldo completo</h2><dl class="kv"><dt>Fecha</dt><dd>${ult}</dd><dt>Disco externo</dt><dd>Copia verificada ✓ (la huella SHA-256 coincide)</dd><dt>OneDrive</dt><dd>No configurado · <a ${go("PAN-08?estado=onedrive")}>Configurar</a></dd><dt>Próximo automático</dt><dd>${prox}</dd></dl></div>`;
  let msg="";
  if(pend) msg=M("warn","El disco externo no está conectado. El respaldo automático de ayer (03/11/2026, 16:30) quedó pendiente.","SIGEDA lo reintenta cada 30 minutos y avisa al iniciar sesión. Conecte el disco y presione «Respaldar ahora».");
  if(st==="error") msg=M("error","El respaldo de hoy a las 10:05 falló: la copia en el disco externo no coincide con el original.","No se usará esa copia. Revise que el disco tenga espacio y no esté dañado, y presione «Respaldar ahora». Si vuelve a fallar, cambie de disco.");
  if(hecho) msg=M("ok","Respaldo completo y verificado: 04/11/2026 10:05.","La copia en el disco externo coincide con el original. Ya puede desconectar el disco al cerrar la jornada.");
  if(st==="vacio") return shell("PAN-08",`<h1>Respaldo y restauración</h1>${M("warn","Aún no hay ningún respaldo.","Conecte el disco externo y presione «Respaldar ahora». Después SIGEDA respaldará solo todos los días.")}<div class="actions"><a class="btn pri" ${go("PAN-08?estado=cargando")}>Respaldar ahora</a></div>`);
  if(st==="onedrive") return shell("PAN-08",`<div class="crumb"><a ${go("PAN-08")}>Respaldos</a> › OneDrive</div><h1>Configurar copia en OneDrive</h1><p class="sub">Copia adicional del respaldo cifrado en la carpeta de OneDrive de esta computadora. Solo si la ASADA confirma que su licencia de Microsoft incluye OneDrive (S-10).</p>
    <div class="panel">${F("Carpeta de OneDrive sincronizada",`<input value="C:\\Users\\Acueducto\\OneDrive\\Respaldos SIGEDA">`,{req:true,hint:"En el sistema real, «Elegir…» abre el selector de carpetas de Windows."})}
    <label style="display:block;margin-top:10px"><input type="checkbox" checked style="min-height:0"> Copiar cada respaldo también a OneDrive y verificar su huella SHA-256</label>
    <p class="hint">El respaldo queda «completo» si al menos una copia se verifica (disco externo u OneDrive). Los archivos van cifrados: sin la clave no se pueden abrir.</p>
    <div class="actions"><a class="btn" ${go("PAN-08")}>Cancelar</a><a class="btn pri" ${go("PAN-08")}>Guardar configuración</a></div></div>`);
  if(st==="prueba") return shell("PAN-08",`<div class="crumb"><a ${go("PAN-08")}>Respaldos</a> › Prueba de restauración</div><h1>Registrar una prueba de restauración</h1><p class="sub">Cada 3 meses (propuesta) se restaura un respaldo en otra computadora para comprobar que sirve (RNF-04). Aquí se anota el resultado.</p>

 "D-06":()=>`<h2 id="dlgt">Agregar persona asociada</h2><p class="hint">Busque primero si la persona ya está registrada, para no duplicarla.</p>${F("Buscar por cédula o nombre",`<input value="2-0000-0456">`)}${T(["Persona","Identificación","Vínculos actuales",""],[`<tr><td>Esteban Mora Vega</td><td>2-0000-0456</td><td>Cotitular de 0412</td><td><a class="btn sm" ${go("PAN-06?estado=modificar")}>Elegir</a></td></tr>`],"Personas encontradas")}<p class="hint" style="margin-top:10px">¿No aparece? Registre una persona nueva:</p><div class="row">${F("Nombre completo",`<input>`,{req:true})}${F("Rol",`<select><option>Cotitular</option><option>Apoderada</option></select>`,{req:true})}</div><div class="row">${F("Tipo de identificación",`<select><option>Cédula física</option><option>Cédula jurídica</option><option>DIMEX</option><option>Pasaporte</option></select>`,{req:true})}${F("Número",`<input placeholder="1-0000-0000">`,{req:true})}${F("Desde",`<input value="${HOY}">`,{req:true,hint:"dd/mm/aaaa"})}</div><div class="actions"><a class="btn" ${back()}>Cancelar</a><a class="btn pri" ${go("PAN-06?estado=modificar")}>Agregar al expediente</a></div>`,

function checkD05(){ const ok=(document.getElementById("d5k").value.trim()&&document.getElementById("d5a").value.trim()&&document.getElementById("d5c").value.trim()==="RESTAURAR"); const b=document.getElementById("d5b"); b.setAttribute("aria-disabled",ok?"false":"true"); document.getElementById("d5h").textContent=ok?"Listo: puede restaurar.":"El botón se activa al completar la clave, la autorización y la palabra RESTAURAR."; }

/* ---------------------------- Router ---------------------------- */
let current={id:"PAN-01",st:"",dlg:"",q:""};
function parse(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,""))||"PAN-01";
  const i=h.indexOf("?"); const id=i<0?h:h.slice(0,i); const p=new URLSearchParams(i<0?"":h.slice(i+1));
  return {id:SCREENS[id]?id:"PAN-01",st:p.get("estado")||"",dlg:p.get("dlg")||"",q:p.get("q")||""};
}
function render(){
  document.querySelectorAll("dialog.dlg").forEach(d=>{d.dataset.silent="1";d.remove();}); document.querySelectorAll(".ovbg").forEach(o=>o.remove());
  current=parse(); FID=0;
  const sp=new URLSearchParams(location.search);
  if(sp.get("hifi")==="1") HIFI=true;
  document.body.classList.toggle("hifi",HIFI);
  document.body.classList.toggle("captura",sp.get("captura")==="1");
  const st=current.st||STATES[current.id][0];
  document.getElementById("root").innerHTML=SCREENS[current.id](st);
  document.title=`SIGEDA · ${current.id} ${INVENTARIO.find(s=>s.id===current.id).nombre}`;
  buildPanel();
  if(current.dlg&&DLG[current.dlg]) openDlg(current.dlg); else window.scrollTo(0,0);
}
function openDlg(id){
  const d=document.createElement("dialog"); d.className="dlg"; d.setAttribute("aria-labelledby","dlgt");
  d.innerHTML=`<div class="hint" style="float:right">${id}</div>${DLG[id]()}`;
  document.body.appendChild(d); d.showModal();
  if(document.body.classList.contains("captura")){ const o=document.createElement("div"); o.className="ovbg"; document.body.appendChild(o); }
  const first=d.querySelector("input,select,textarea,a.btn"); if(first) first.focus();
  d.addEventListener("close",()=>{ if(d.dataset.silent) return; d.remove(); if(current.dlg) location.hash=routeNoDlg(); });
}
window.addEventListener("hashchange",render);

/* Panel del prototipo: no es parte del diseño; sirve para recorrer pantallas, estados y diálogos */
function buildPanel(){
  const st=STATES[current.id]||[];
  const p=document.getElementById("protoPanel");
  p.innerHTML=`<p class="ph4" style="margin-top:0">${current.id} · ${INVENTARIO.find(s=>s.id===current.id).nombre}</p>
  <p class="ph4">Estados de esta pantalla</p>${st.map(s=>`<a href="#/${current.id}?estado=${s}">${s}</a>`).join(" ")}
  <p class="ph4">Pantallas</p>${INVENTARIO.map(s=>`<a href="#/${s.id}" title="${s.nombre}">${s.id}</a>`).join(" ")}
  <p class="ph4">Diálogos</p>${Object.keys(DIALOGOS).map(k=>`<a href="#/${DLG_HOST[k]}${DLG_HOST[k].includes("?")?"&":"?"}dlg=${k}" title="${DIALOGOS[k]}">${k}</a>`).join(" ")}
  <p class="ph4">Aspecto</p><a href="#" id="tg">${HIFI?"Ver wireframe (gris)":"Ver maqueta de alta fidelidad"}</a>`;
  p.querySelectorAll("a:not(#tg)").forEach(a=>a.addEventListener("click",()=>document.getElementById("proto").classList.remove("open")));
  document.getElementById("tg").onclick=e=>{e.preventDefault();HIFI=!HIFI;const u=new URL(location.href);u.searchParams.delete("hifi");history.replaceState(null,"",u);render();};
}
document.getElementById("protoBtn").onclick=()=>document.getElementById("proto").classList.toggle("open");
document.addEventListener("click",e=>{ const a=e.target.closest('a[aria-disabled="true"]'); if(a){ e.preventDefault(); } });
render();
</script>
</body>
